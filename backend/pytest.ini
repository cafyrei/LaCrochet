[pytest]
testpaths = tests
addopts = -ra -p no:cacheprovider
markers =
    contract: checks our messages and their answers against PayRex / Lalamove / Gemini's published rules
    integration: whole journeys through the backend, the test database and the stand-ins
    interface: what the website gets back from each backend address it uses
    live: optional, talks to the REAL sandboxes (run with: pytest -m live)
filterwarnings =
    ignore::DeprecationWarning
