<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="La Crochet: handmade crochet pieces and yarn from the Philippines." />
    <meta name="theme-color" content="#FBF7F2" />
    <!-- Light and dark mode. The line below applies a saved choice from the
         sun/moon button before the page draws, so it never flashes the wrong colours. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content =
          localStorage.getItem("color-scheme") ?? "light dark";
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/src/assets/La Crochet Ico.svg" />

    <!-- Body font: Nunito Sans (headings use Lora, stored in the project) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
    />

    <title>La Crochet: handmade crochet from the Philippines</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
